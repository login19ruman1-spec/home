name: DomeGuard
version: 1.1.0
main: ru.domeguard.DomeGuardPlugin
api-version: '1.21'
author: DomeGuard
description: Configurable death dome for Purpur/Paper 1.21.4

commands:
  dome:
    description: Open DomeGuard settings
    usage: /dome
    permission: dome.admin

permissions:
  dome.admin:
    description: Allows managing the death dome
    default: op
